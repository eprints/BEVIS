# This file is copied into /opt/eprints3/[ARCHIVE ID]/nginx/ by generate_apacheconf_for_anubis so you can make archive specific changes
# Then make sure that /etc/nginx/nginx.conf includes it directly or via conf.d/ or sites-enabled/ (depending on your distro)

#$server_name is a special variable, "perserverconn" is just the name of this limit zone
#we will limit maximum number of simulatanious connections to search
limit_conn_zone $server_name zone=perserverconn:10m;
limit_conn_zone $binary_remote_addr zone=peripconn:10m;
#also limit how max rate of searchers per IP
limit_req_zone $binary_remote_addr zone=periprate:10m rate=1r/s;
#and limit rate of searches across entire server
limit_req_zone $server_name zone=perserverrate:10m rate=50r/s;

# requires nginx running as eprints user and the selinux config from the readme
proxy_cache_path /opt/eprints3/var/cache/nginx/cpu_heavy_cache 
	levels=1:2 # layouts the cache in folders, unsure if useful or not
    keys_zone=cpu_heavy_cache:10m # name of zone in memory
    max_size=1g # will a gig be enough?
    inactive=300s; # keep for up to 5mins, even if nothing requests it in that time


proxy_cache_path /opt/eprints3/var/cache/nginx/everything_else_cache 
	levels=1:2 # layouts the cache in folders, unsure if useful or not
    keys_zone=everything_else_cache:10m # name of zone in memory
    max_size=1g # will a gig be enough?
    inactive=300s; # keep for up to 5mins, even if nothing requests it in that time

#a path we can write to when using the eprints user instead of nginx
proxy_temp_path /tmp/nginx_proxy;

# any response with Content-Type header from the upstream proxy (EPrints) which matches the following regexes will return 1, and thus not be cached
# TODO longer term - fix the Cache-Control header so we can trust it. We actually would like to cache thumbnails. We don't want to be caching large documents.
map $upstream_http_content_type $no_cache_media {
    default                  0;
    ~^image/                 1;
    ~^video/                 1;
    ~^audio/                 1;
	~^application/           1;
}

upstream eprints_backend {
    server [::1]:3000;
	# we seem to far be more responsive without keepalive connections. Why?
    #keepalive 0; - this doesn't exist in nginx 1.20 which appears to be the default on RHEL 9
}

#doing a mix of max connections and rates as max connections is a straight cut-off which rejects beyond that
#with rates you can have "burst" which allows a queue to build up and be processed at the maximum rate

server{
	listen [::1]:10001 default_server;
	server_name _;
	
	# Should be off by default, but belt and braces so we get the real EPrints error pages, not nginx defaults
	proxy_intercept_errors off;

	set_real_ip_from  ::1;
	real_ip_header    X-Real-IP;
	
	# bump up all the timeouts as some legitimate EPrints requests really can be this slow
	proxy_connect_timeout       300;
	proxy_send_timeout          300;
	proxy_read_timeout          300;
	send_timeout                300;

	location / {
		#default all locations, should be overriden by anything specific later
		proxy_pass http://eprints_backend;
		proxy_set_header X-Real-IP $remote_addr;

		# bodge - try again if we get an error. Given that EPrints has a memory leak and MaxConnectionsPerChild is set low in apache, random requests WILL die.
		# can't work in all circumstances (for example, when something has already been sent to the client), but does work in some.
		# proxy_next_upstream error http_500;
		# proxy_next_upstream_tries 3;
		
		proxy_cache everything_else_cache;

		# Just ignore EPrints when it says not to cache. We want to cache.
		proxy_ignore_headers Cache-Control;

		# Bypass cache when a session cookie is present
		proxy_cache_bypass $cookie_secure_eprints_session;
		# Do not store response when a session cookie is present or is likely a file from disc (for reasons unknown, adding $no_cache_media to proxy_cache_bypass breaks this entirely)
		proxy_no_cache $cookie_secure_eprints_session $no_cache_media;

		# no need for $scheme - eprints is the same on both and if we're using anubis and nginx it's https only anyway
		# I think we can just use request_uri and nothing else, if we're bypassing cache for logged in users
		proxy_cache_key "$request_uri";

		
		proxy_cache_valid 200 300s;
		# except anything else, like errors or redirects
		proxy_cache_valid any 30s;

		# "Other requests of the same cache element will either wait for a response to appear in the cache or the cache lock for this element to be released"
		# perfect! effectively rate limits identical requests
		proxy_cache_lock on;

		# We really don't want the slowest requests to be the ones duplicated, so bump these right up
		proxy_cache_lock_age 300s;
		proxy_cache_lock_timeout 300s;

		# useful for debug, probably don't want in production, no idea what the bots will do with this info
		add_header X-Cache-Status $upstream_cache_status;
	}

	# below everything is forwarded to the same proxy as above. If you require different rate limiting per URL, you can create more location blocks (example given)
	location ~ ^/cgi/(search|facet|export|exportview|stats) {
		proxy_pass http://eprints_backend;
		proxy_set_header X-Real-IP $remote_addr;
		# limit to relatively small number active connections to this location at any one time before we 503, to keep CPU usage down.
		limit_conn perserverconn 10;
		# I'm honestly not sure I can see any legitimate reason to have more than a tiny number of active connections per IP. NAT maybe?
		# the rate limiting burst should hold these open and trickle them through anyway, reducing the impact of it being low
		limit_conn peripconn 2;
		# burst here being used as a queue which will delay any requests up to the burst size, any more requests beyond that are 503ed
		limit_req zone=periprate burst=20;
		limit_req zone=perserverrate burst=100;
		# hitting a limit will result in an HTTP 503 by default. 503_error_handling.conf (in apache) will filter based on URL to provide a useful error page

		# TODO understand how the cache will interact with the rate and connection limits.
		# proxy_cache_lock will hold a connection until its in the cache if there already is a concurrent identical connection going on.
		# does this held connection also add to the rate and connection limits?

		# Enable caching
        proxy_cache cpu_heavy_cache;

		# Bypass cache when a session cookie is present
		proxy_cache_bypass $cookie_secure_eprints_session;
		# Also do not store response in cache (really don't want this if they were logged in!)
		proxy_no_cache $cookie_secure_eprints_session;

		# Just ignore EPrints when it says not to cache. We want to cache.
		proxy_ignore_headers Cache-Control;

		# make sure we don't cache a page from a logged in user and serve to anyone else
		# needs to be combined with z_fix_cookies.pl to fix the name of the cookie
		# can skip this if using proxy_cache_bypass
		# proxy_cache_key "$host$request_uri$cookie_secure_eprints_session";

		# no need for $scheme - eprints is the same on both and if we're using anubis and nginx it's https only anyway
		# I think we can just use request_uri and nothing else, if we're bypassing cache for logged in users
		proxy_cache_key "$request_uri";

		# cache for up to 1hour
		proxy_cache_valid any 1h;

		# "Other requests of the same cache element will either wait for a response to appear in the cache or the cache lock for this element to be released"
		# perfect! effectively rate limits identical requests
		# With some rudamentary testing this appears to take priority over the connection limit
		proxy_cache_lock on;

		# We really don't want the slowest requests to be the ones duplicated, so bump these right up
		proxy_cache_lock_age 300s;
		proxy_cache_lock_timeout 300s;

		# useful for debug, probably don't want in production, no idea what the bots will do with this info
		add_header X-Cache-Status $upstream_cache_status;
	}

	location ~ ^/(cgi/oai2|rest) {
		# various APIs. We want to rate limit, but not cache
		proxy_pass http://eprints_backend;
		proxy_set_header X-Real-IP $remote_addr;
		limit_conn perserverconn 10;
		limit_conn peripconn 2;
		limit_req zone=periprate burst=20;
		limit_req zone=perserverrate burst=100;

	}

	# note - need commercial subscription for nginx to be able to have a special request purge the cache, so for now we'll do this via deleting directories.

	# if you want to have different rate limits for one location, remove it from the regex in the location block above and put it here like this:
	# note that you will also need to duplicate cache configuration
	# location /cgi/stats {
	# 	proxy_pass http://[::1]:3000;
	# 	proxy_set_header X-Real-IP $remote_addr;
	# 	limit_conn perserverconn 10;
	# 	limit_conn peripconn 2;
	# 	limit_req zone=periprate burst=20;
	# 	limit_req zone=perserverrate burst=100;
	# }	

}
