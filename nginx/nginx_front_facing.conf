# Copy this file into /opt/eprints3/[ARCHIVE ID]/nginx/ so you can make archive specific changes
# This file configures nginx to listen publically on ports 80 and 443.
# It requires an nginx-ssl.nginxconf file in archive/ssl/. This is the replacement for securevhost.conf
# On RHEL httpd must be disabled or reconfigured to not listen on ports 80/443.


upstream anubis {
    server [::1]:8923;
	# we seem to far be more responsive without keepalive connections. Why?
    # keepalive 0; # not supported in nginx 1.20, the default on rocky 9
}

#redirect HTTP to HTTPS
server {
    listen 80 default_server;
    server_name _;
    
    return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	server_name _;

	# Include the SSL configuration, ported to nginx from securevhost.conf
    include /opt/eprints3/archives/*/ssl/*.nginxconf;

	# Should be off by default, but belt and braces so we get the real EPrints error pages, not nginx defaults
	proxy_intercept_errors off;

    access_log /var/log/nginx/front_access.log;
    error_log /var/log/nginx/front_error.log;
	
	


	location / 
	{
		#default all locations, should be overriden by anything specific later
		proxy_pass http://anubis;
		proxy_set_header X-Real-IP $remote_addr;

		#TODO how slow is the regex?
		location ~ ^/cgi/(search|facet|export|exportview|stats) 
		{
			# Seems for nginx we need to repeat the proxy_pass details, even in a nested location
			proxy_pass http://anubis;
			proxy_set_header X-Real-IP $remote_addr;
			# only want to proxy_intercept_errors for the minimum set of URLs because HTTP 401 is used by the login page
			# can't seem to do this quite as elegantly as we used to in Apache, so have one generic feature unavailable for all rate limiting
			proxy_intercept_errors on;
			error_page  503 /feature_unavailable.html;
		}

	}

	# Forward anything shibboleth related directly to the EPrints backend, bypassing anubis and cache
	location ~ ^/(shibboleth|cgi/shibboleth) 
	{
		proxy_pass http://eprints_backend;
		proxy_set_header X-Real-IP $remote_addr;
	}

	

}
