# This is a minimal Apache config file, intended to replace /etc/httpd/conf/httpd.conf for the purposes of hosting only EPrints locally
# Nginx will be used as a reverse proxy in front, performing caching and filtering, so
# there shouldn't (hopefully) be excessive traffic reaching EPrints.

Include /etc/httpd/conf.modules.d/00-base.conf
Include /etc/httpd/conf.modules.d/00-systemd.conf
Include /etc/httpd/conf.modules.d/01-cgi.conf
Include /etc/httpd/conf.modules.d/02-perl.conf
Include /etc/httpd/conf.modules.d/10-h2.conf

IncludeOptional /etc/httpd/conf.d/shib.conf

LoadModule mpm_prefork_module modules/mod_mpm_prefork.so

PidFile /var/run/httpd/eprints-httpd.pid

User apache
Group apache
ServerAdmin root@localhost
<Directory />
  AllowOverride none
  Require all denied
</Directory>

<Files ".ht*">
  Require all denied
</Files>


TypesConfig /etc/mime.types
AddType application/x-compress .Z
AddType application/x-gzip .gz .tgz
AddType text/html .shtml
AddOutputFilter INCLUDES .shtml
AddDefaultCharset UTF-8
MimeMagicFile conf/magic
EnableSendfile on

Include /opt/eprints3/cfg/apache_internal.conf

# limit detail in Server header
ServerTokens Prod

<IfModule mpm_prefork_module>
  # The file handle leak with xapian search is fixed by using latest xapian_facets from svn along with latest site_lib for EPrints 3.4.6/3.4.7 or EPrints 3.4.8+
  # If we can track down the remaining memory leaks we can bump this up or remove the limit entirely
  MaxConnectionsPerChild          1000
</IfModule>
