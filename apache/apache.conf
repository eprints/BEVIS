

Include /etc/httpd/conf.modules.d/00-base.conf
Include /etc/httpd/conf.modules.d/00-systemd.conf
Include /etc/httpd/conf.modules.d/01-cgi.conf
Include /etc/httpd/conf.modules.d/02-perl.conf
Include /etc/httpd/conf.modules.d/10-h2.conf

LoadModule mpm_prefork_module modules/mod_mpm_prefork.so

PidFile /var/run/httpd/eprints-httpd.pid

User apache
Group apache
ServerAdmin root@localhost
<Directory />
  AllowOverride none
  Require all denied
</Directory>

<Files ".ht*">
  Require all denied
</Files>


TypesConfig /etc/mime.types
AddType application/x-compress .Z
AddType application/x-gzip .gz .tgz
AddType text/html .shtml
AddOutputFilter INCLUDES .shtml
AddDefaultCharset UTF-8
MimeMagicFile conf/magic
EnableSendfile on

Include /opt/eprints3/cfg/apache.conf


